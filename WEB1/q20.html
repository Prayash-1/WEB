<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/prayash/questoins_html/question_css/q20.css">
</head>

<body>

<h2>HOVER-EFFECT CSS</h2>

<div class="grid">

  <div>
    <div class="box zoomin">
      <img src="/pictures/nature1.jpg">
    </div>
    <p class="label">Hover-ZoomIn</p>
  </div>

  <div>
    <div class="box fade">
      <img src="/pictures/nature2.jpg">
    </div>
    <p class="label">Hover-Fade</p>
  </div>

  <div>
    <div class="box blur">
      <img src="/pictures/nature3.jpg">
      <div class="overlay">Hover Blur</div>
    </div>
    <p class="label">Hover-Blur</p>
  </div>

  <div>
    <div class="box mask">
      <img src="/pictures/nature4.jpg">
      <div class="overlay"></div>
    </div>
    <p class="label">Hover-Mask</p>
  </div>

  <div>
    <div class="box zoomout">
      <img src="/pictures/nature5.jpg">
    </div>
    <p class="label">Hover-Zoomout</p>
  </div>

  <div>
    <div class="box blurout">
      <img src="/pictures/nature6.jpg">
    </div>
    <p class="label">Hover-Blurout</p>
  </div>

  <div>
    <div class="box overlaytext">
      <img src="/pictures/nature7.jpg">
      <div class="overlay">Overlay Text</div>
    </div>
    <p class="label">Overlay Text</p>
  </div>

  <div>
    <div class="box fall">
      <img src="/pictures/nature8.jpg">
    </div>
    <p class="label">Hover-Fall</p>
  </div>

</div>

</body>
</html>
