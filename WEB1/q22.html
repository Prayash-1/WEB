<!DOCTYPE html>
<html lang="ne">
<head>
    <title>PSC Registration Form</title>
    <link rel="stylesheet" href="/prayash/questoins_html/question_css/q22.css">
</head>
<body>
    <div class="form-container">
        <header>
            <div class="lang-switch">नेपा ▾</div>
            <div class="logo-area">
                <img src="/pictures/nepal.jpg" alt="Nepal Logo" class="logo">
                <span class="org-name">लोक सेवा आयोग</span>
            </div>
        </header>

        <h2>दर्ता गर्नुहोस्</h2>

        <form>
            <div class="form-grid">
                <div class="input-group">
                    <label>पहिलो नाम *</label>
                    <input type="text" autofocus>
                </div>
                <div class="input-group">
                    <label>बीचको नाम</label>
                    <input type="text">
                </div>
                <div class="input-group">
                    <label>थर *</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>प्रयोगकर्ता नाम *</label>
                    <input type="text">
                </div>
                <div class="input-group">
                    <label>जन्म मिति (वि.सं.) *</label>
                    <input type="date">
                </div>
                <div class="input-group">
                    <label>जन्म मिति (ई.सं.) *</label>
                    <input type="date" disabled class="disabled-field">
                </div>
                <div class="input-group full-width">
                    <label>लिङ्ग *</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" checked> पुरुष</label>
                        <label><input type="radio" name="gender"> महिला</label>
                        <label><input type="radio" name="gender"> अन्य</label>
                    </div>
                </div>
                <div class="input-group span-2">
                    <label>ईमेल *</label>
                    <input type="email">
                </div>

                <div class="input-group">
                    <label>मोबाइल नम्बर *</label>
                    <input type="text">
                </div>
                <div class="input-group">
                    <label>राष्ट्रिय परिचय नम्बर</label>
                    <input type="text">
                </div>
                <div class="input-group">
                    <label>नागरिकता नम्बर *</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>नागरिकता जारी जिल्ला *</label>
                    <select>
                        <option>विकल्प छान्नुहोस् ...</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>नागरिकता जारी मिति (वि.सं.) *</label>
                    <input type="date">
                </div>
                <div class="input-group">
                    <label>नागरिकता जारी मिति (ई.सं.) *</label>
                    <input type="date" disabled class="disabled-field">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-back">लग-इनमा फर्कनुहोस्</button>
                <button type="submit" class="btn-submit">बुझाउनुहोस्</button>
            </div>
        </form>
    </div>
</body>
</html>
