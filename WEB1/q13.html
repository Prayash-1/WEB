<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/prayash/questoins_html/question_css/q13.css">
    <title>Registration / Login Form</title>
</head>
<body>
<div class="container">
    <h1>REGISTRATION / LOGIN FORM</h1>
    <div class="main">
        <div class="left">
            <h2>Register Form :</h2>
            <input type="text" placeholder="Username">
            <input type="email" placeholder="Email">
            <div class="small">Please enter a valid email address.</div>
            <input type="password" placeholder="Password">
            <div class="small">Minimum of 8 characters.</div>
            <input type="password" placeholder="Confirm password">
            <div class="gender">
                <label><input type="radio" name="g"> Female</label>
                <label><input type="radio" name="g"> Male</label>
            </div>
            <div class="terms">
                <label>
                    <input type="checkbox">
                    I have read and accept terms of use.
                </label>
            </div>
            <button class="btn">SUBMIT</button>
        </div>
        <div class="right">
            <h2>Login form :</h2>
            <input type="email" placeholder="Enter Your Email">
            <input type="password" placeholder="Password">
            <div class="remember">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>
            </div>
            <button class="btn">LOGIN</button>
        </div>
    </div>
    <div class="footer">
        © 2025 Registration / Login Form . All Rights Reserved.
    </div>
</div>
</body>
</html>
