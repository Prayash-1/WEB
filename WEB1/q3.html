<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting</title>
</head>
<body>
    <b>Bold</b><br>
    <strong>Strong</strong><br>
    <i>Italic</i><br>
    <em>Emphasis</em><br>
    <q>Short Quote</q><br>
    <blockquote>Long quotation text</blockquote>
    <del>Deleted</del>
    <ins>Inserted</ins><br>
    H<sub>2</sub>O<br>
    2<sup>2</sup> = 4
</body>
</html>
