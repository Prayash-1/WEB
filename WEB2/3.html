<!-- 3. Write a JavaScript program that accept two integers and display the larger and smaller. -->
<!DOCTYPE html>
<html>
<head>
    <title>Larger or Smaller Number</title>
    <script>
        function compare() {
    let a = parseFloat(document.getElementById("num1").value);
    let b = parseFloat(document.getElementById("num2").value);
    if (isNaN(a) || isNaN(b)) {
        alert("Enter numbers");
        return;
    }
    let result = a > b ? `${a} is larger and ${b} is smaller` :
                 a < b ? `${b} is larger and ${a} is smaller` : "Both are equal";
    document.getElementById("result").innerHTML = result;
}

    </script>
</head>
<body>
    <h1>Larger or Smaller Number</h1>
    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">
    <button onclick="compare()">Compare</button>
    <div id="result"></div>
</body>
</html>
