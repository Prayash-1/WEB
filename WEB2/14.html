<!-- 14. Write JavaScript program to clone element and remove element from table 
a. If user click on add new button new row must be added as a last row 
b. If user click on trash icon, remove related row from DOM -->
<!DOCTYPE html>
<html>
<head>
    <title>Add and Remove Table Row</title>
    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        button {
            padding: 8px;
        }
        .trash{
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgy6cH4pk8uBtQ-_MBHx5MtDO8ms62KxR0UQ&s');
            background-size: cover;
        }
    </style>
</head>
<body>

<h2>Add and Remove Row</h2>

<table id="productTable">
    <tr>
        <th>No</th>
        <th>Product</th>
        <th>Price</th>
        <th>Action</th>
    </tr>
    <tr>
        <td>1</td>
        <td>
            <select>
                    <option value="" disabled selected>Select a product</option>
                    <option value="laptop">Laptop</option>
                    <option value="phone">Smartphone</option>
                    <option value="headphones">Headphones</option>
                    <option value="keyboard">Keyboard</option>
                </select>
        </td>
        <td><input type="number" placeholder="Price"></td>
        <td><button onclick="removeRow(this)" class="trash"></button></td>
    </tr>
</table>

<br>
<button onclick="addRow()">Add New</button>

<script>
let count = 1;

function addRow() {
    count++;

    let table = document.getElementById("productTable");
    let row = table.insertRow();

    row.innerHTML = `
        <td>${count}</td>
        <td><input type="text" placeholder="Product Name"></td>
        <td><input type="number" placeholder="Price"></td>
        <td><button onclick="removeRow(this)" class="trash"></button></td>
    `;
}

function removeRow(button) {
    let row = button.parentNode.parentNode;
    row.remove();
}
</script>

</body>
</html>
