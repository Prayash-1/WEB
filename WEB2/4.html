<!-- 4. Write a JavaScript program that accept three integers and display the larger and smaller.  -->
 <!DOCTYPE html>
<html>
<head>
    <title>Largest and Smallest of Three Numbers</title>
</head>
<body>

    <h2>Find Larger and Smaller Number</h2>

    <label>Enter First Number:</label>
    <input type="number" id="num1">
    <br><br>

    <label>Enter Second Number:</label>
    <input type="number" id="num2">
    <br><br>

    <label>Enter Third Number:</label>
    <input type="number" id="num3">
    <br><br>

    <button onclick="findNumbers()">Find Result</button>

    <h3 id="result"></h3>

    <script>
        function findNumbers() {
            let a = parseInt(document.getElementById("num1").value);
            let b = parseInt(document.getElementById("num2").value);
            let c = parseInt(document.getElementById("num3").value);

            if (isNaN(a) || isNaN(b) || isNaN(c)) {
                document.getElementById("result").innerHTML = "Please enter all three numbers.";
                return;
            }

            let largest = a;
            let smallest = a;

            if (b > largest) {
                largest = b;
            }

            if (c > largest) {
                largest = c;
            }

            if (b < smallest) {
                smallest = b;
            }

            if (c < smallest) {
                smallest = c;
            }

            document.getElementById("result").innerHTML =
                "Largest Number: " + largest + "<br>" +
                "Smallest Number: " + smallest;
        }
    </script>

</body>
</html>
