<!-- 1. Write a Program to demonstrate the use of different types of JavaScript. -->
<!DOCTYPE html>
<html>
<head>
    <title>Types of JavaScript</title>
    <script>
        function internalJS() {
            alert("This is Internal JavaScript");
        }
    </script>
</head>
<body>
    <h1>Types of JavaScript Demo</h1>

    <h2>1. Inline JS</h2>
    <button onclick="alert('This is Inline JavaScript')">Click Inline JS</button>

    <h2>2. Internal JS</h2>
    <button onclick="internalJS()">Click Internal JS</button>

    <h2>3. External JS</h2>
    <button onclick="externalJS()">Click External JS</button>

    <script src="script.js"></script>
</body>
</html>
