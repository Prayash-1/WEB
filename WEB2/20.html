<!-- 20. Write a jQuery program that apply different effect into a div element when a button is 
clicked 
a. Hide 
b. Show 
c. Toggle 
d. Slideup 
e. Slidedown 
f. 
Css -->
<!DOCTYPE html>
<html>
<head>
    <title>jQuery Effects</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        #box {
            width: 200px;
            height: 150px;
            background-color: lightblue;
            border: 2px solid black;
            margin-top: 20px;
            padding: 20px;
        }
    </style>
</head>
<body>

<h2>jQuery Effects</h2>

<button id="hide">Hide</button>
<button id="show">Show</button>
<button id="toggle">Toggle</button>
<button id="slideUp">Slide Up</button>
<button id="slideDown">Slide Down</button>
<button id="css">CSS</button>

<div id="box">This is a div box.</div>

<script>
$(document).ready(function() {
    $("#hide").click(function() {
        $("#box").hide();
    });

    $("#show").click(function() {
        $("#box").show();
    });

    $("#toggle").click(function() {
        $("#box").toggle();
    });

    $("#slideUp").click(function() {
        $("#box").slideUp();
    });

    $("#slideDown").click(function() {
        $("#box").slideDown();
    });

    $("#css").click(function() {
        $("#box").css({
            "background-color": "yellow",
            "color": "red",
            "font-size": "20px"
        });
    });
});
</script>

</body>
</html>
