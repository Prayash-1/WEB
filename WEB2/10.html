<!-- 10. Write JavaScript program to generate following program counter -->
<!DOCTYPE html>
<html>
<head>
    <title>Counter App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .counter-box {
            width: 250px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f7f4fb;
            border-radius: 8px;
        }

        h3 {
            margin-bottom: 20px;
        }

        .counter-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 8px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #1b5e20;
        }

        #count {
            background-color: #f6c7c7;
            padding: 8px 25px;
            border-radius: 5px;
            font-weight: bold;
        }

        .reset-btn {
            padding: 8px 18px;
        }
    </style>
</head>
<body>

    <div class="counter-box">
        <h3>Counter App</h3>

        <div class="counter-row">
            <button onclick="increase()">+</button>
            <span id="count">0</span>
            <button onclick="decrease()">-</button>
        </div>

        <button class="reset-btn" onclick="resetCounter()">Reset</button>
    </div>

    <script>
        let counter = 0;

        function increase() {
            counter++;
            document.getElementById("count").innerHTML = counter;
        }

        function decrease() {
            counter--;
            document.getElementById("count").innerHTML = counter;
        }

        function resetCounter() {
            counter = 0;
            document.getElementById("count").innerHTML = counter;
        }
    </script>

</body>
</html>
