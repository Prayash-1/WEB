<!-- 7. Create a div container on HTML document and create 0 to 100 numbers dynamically and 
append to the container div. 
a. Even numbers background is green 
b. Odd numbers background is yellow
c. Prime numbers background is red-->
<!DOCTYPE html>
<html>
<head>
    <title>Number Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #container {
            display: flex;
            flex-wrap: wrap;
            width: 700px;
            gap: 8px;
            margin-top: 20px;
        }

        .number-box {
            width: 50px;
            height: 40px;
            color: black;
            font-weight: bold;
            text-align: center;
            line-height: 40px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <h2>Numbers from 0 to 100</h2>

    <button onclick="generateNumbers()">Generate Numbers</button>

    <div id="container"></div>

    <script>
        // Function to check prime number
        function isPrime(num) {
            if (num < 2) {
                return false;
            }

            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) {
                    return false;
                }
            }

            return true;
        }

        // Function to generate numbers from 0 to 100
        function generateNumbers() {
            let container = document.getElementById("container");

            // Clear previous numbers before generating again
            container.innerHTML = "";

            for (let i = 0; i <= 100; i++) {
                let box = document.createElement("div");

                box.textContent = i;
                box.className = "number-box";

                // Prime numbers background red
                if (isPrime(i)) {
                    box.style.backgroundColor = "red";
                }
                // Even numbers background green
                else if (i % 2 === 0) {
                    box.style.backgroundColor = "green";
                }
                // Odd numbers background yellow
                else {
                    box.style.backgroundColor = "yellow";
                }

                container.appendChild(box);
            }
        }
    </script>

</body>
</html>
